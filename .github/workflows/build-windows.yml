name: Build Windows zhtw-mcp

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Generate OpenCC data
        shell: pwsh
        run: |
          python scripts/gen-s2t-tables.py

      - name: Format generated Rust data
        shell: pwsh
        run: |
          rustfmt src/engine/s2t_data.rs

      - name: Build release exe
        shell: pwsh
        run: |
          cargo build --release

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "target\release\zhtw-mcp.exe")) {
            Write-Error "target\release\zhtw-mcp.exe not found"
            exit 1
          }
          Get-Item "target\release\zhtw-mcp.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: zhtw-mcp-windows-x64
          path: target/release/zhtw-mcp.exe
